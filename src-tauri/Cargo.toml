[package]
name = "deen-lab-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deen_lab_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# bundled: compiles SQLite from source, which guarantees FTS5 is present. The Android system
# SQLite cannot be relied on for FTS5, and the Hadith bundles are useless without it.
rusqlite = { version = "0.32", features = ["bundled"] }
# mirrors the Python pipeline's NFD-based Arabic normalisation (see docs/hadith-data.md)
unicode-normalization = "0.1"
flate2 = "1"
sha2 = "0.10"
futures-util = "0.3"
tauri-plugin-notification = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-geolocation = "2.3.2"
tauri-plugin-device-settings = { path = "plugins/device-settings" }
tauri-plugin-compass = { path = "plugins/compass" }
