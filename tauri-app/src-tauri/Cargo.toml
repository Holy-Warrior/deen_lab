[package]
name = "deen-lab-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deen_lab_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# only the timer is needed -- the delay between rounds of the Feature Studio model chain
tokio = { version = "1", features = ["time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-geolocation = "2.3.2"
tauri-plugin-device-settings = { path = "plugins/device-settings" }
tauri-plugin-compass = { path = "plugins/compass" }
# vendored in from the standalone tauri-plugin-silence-of-salah-engine repo rather than referenced
# by an out-of-tree path, so a fresh clone of this app still builds on any machine
tauri-plugin-silence-of-salah-engine = { path = "plugins/silence-of-salah-engine" }
