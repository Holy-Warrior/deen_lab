[package]
name = "tauri-plugin-device-settings"
version = "0.1.0"
edition = "2021"
description = "Opens native Android device settings screens (e.g. Location) from the app"
license = "MIT"
authors = ["Holy-Warrior"]
links = "tauri-plugin-device-settings"

[lib]
name = "tauri_plugin_device_settings"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
